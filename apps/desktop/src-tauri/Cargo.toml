[package]
name = "ora-desktop"
version = "0.1.0"
description = "Ora Desktop"
authors = ["Eric Wang"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
desktop-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
ora-contracts = { path = "../../../crates/contracts" }
ora-domain = { path = "../../../crates/domain" }
ora-plugin-protocol = { path = "../../../crates/plugin-protocol" }
ora-web-server = { path = "../../web/server" }
