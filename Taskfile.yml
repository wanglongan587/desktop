version: "3"

tasks:
  default:
    cmds:
      - task: list

  list:
    desc: List all tasks in the current project
    cmds:
      - task --list

  ###################################################
  ############## Install Dependencies ###############
  ###################################################

  install:
    desc: Install all dependencies for the project
    cmds:
      - task: install:frontend
      - task: install:backend
      - task: install:desktop
      - task: build

  install:frontend:
    desc: Install dependencies for the frontend packages
    cmds:
      - pnpm install

  install:backend:
    desc: Install dependencies for the Rust backend
    cmds:
      - cargo fetch

  install:desktop:
    desc: Install dependencies for the desktop Tauri app (excluded from workspace)
    dir: apps/desktop/src-tauri
    cmds:
      - cargo fetch

  ###################################################
  ############## Clean and Build Tasks ##############
  ###################################################

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf node_modules
      - |
        {{if eq OS "windows"}}
        pnpm -r exec -- powershell -NoProfile -Command "if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }"
        {{else}}
        pnpm -r exec -- rm -rf node_modules
        {{end}}
      - pnpm store prune
      - cargo clean

  lint:
    desc: Run linters for the frontend, backend, and Desktop app
    cmds:
      - task: lint:frontend
      - task: lint:backend
      - task: lint:desktop

  lint:backend:
    desc: Run linters on all Rust crates
    silent: true
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace -- -D warnings

  lint:frontend:
    desc: Run linters on all frontend packages
    silent: true
    cmds:
      - pnpm --filter @ora/contracts lint
      - pnpm --filter @ora/web-client lint
      - pnpm --filter @ora/chat lint
      - pnpm --filter @ora/platform lint
      - pnpm --filter @ora/workflow-runtime lint
      - pnpm --filter @ora/app-shell lint

  lint:desktop:
    desc: Run linters for the Desktop TypeScript package and Tauri Rust workspace
    silent: true
    cmds:
      - pnpm --filter @ora/desktop lint
      - cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  export-contracts:
    desc: Regenerate TypeScript contracts and the frontend SDK package
    cmds:
      - cargo xtask export-contracts
      - pnpm --filter @ora/contracts generate:error-schema

  export-plugin-sdk:
    desc: Regenerate TypeScript plugin SDK protocol types
    cmds:
      - cargo xtask export-plugin-sdk

  check-generated:
    desc: Verify generated contracts and plugin protocol files without rewriting them
    cmds:
      - cargo xtask export-contracts --check
      - cargo xtask export-plugin-sdk --check

  prepare-plugin-runtime:
    desc: Explicitly download, verify, bundle, and stage pinned plugin runtime resources
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-plugin-runtime.ps1

  verify-plugin-runtime-prepared:
    desc: Verify that pinned plugin runtime resources were prepared explicitly
    internal: true
    cmds:
      - powershell -NoProfile -Command "if (-not (Test-Path -LiteralPath 'runtime-assets/prepared/runtime-manifest.json' -PathType Leaf)) { throw 'plugin runtime resources are not prepared; run task prepare-plugin-runtime before task test:system' }"

  test-plugin-runtime-e2e:
    desc: Run the real pinned Bun and Windows Job integration gates
    cmds:
      - task: verify-plugin-runtime-prepared
      - pnpm --filter @ora-space/plugin-sdk build
      - cargo test -p ora-process bun_stdio_round_trips_through_windows_job_pipes -- --ignored --test-threads=1
      - cargo test -p ora-process abrupt_host_exit_closes_the_job_and_kills_descendants -- --ignored --test-threads=1
      - cargo test -p ora-plugin-manager --test runtime_windows_e2e -- --ignored --test-threads=1
      - cargo test -p ora-plugin-manager --test plugin_library_e2e -- --ignored --test-threads=1
      - cargo test -p ora-web-server --test backend_runtime_windows_e2e -- --ignored --test-threads=1

  build:
    desc: Build all crates
    cmds:
      - cargo build --workspace

  test:frontend:
    desc: Run TypeScript package test suites (contracts, chat, platform, workflow-runtime, app-shell)
    cmds:
      - task: export-contracts
      - task: lint:frontend
      - pnpm --filter @ora/contracts test
      - pnpm --filter @ora/chat test
      - pnpm --filter @ora/platform test
      - pnpm --filter @ora/workflow-runtime test
      - pnpm --filter @ora/app-shell test
      - node --test scripts/collect-test-evidence.test.mjs
      - pnpm --filter @ora-space/plugin-sdk test
      - pnpm --filter @ora-space/plugin-runtime test
      - pnpm --filter @ora/ui test

  test:backend:
    desc: Run Rust crate test suites
    cmds:
      - task: lint:backend
      - cargo test --workspace

  test:desktop:
    desc: Run the Desktop transport and independent Tauri Rust workspace tests
    cmds:
      - task: lint:desktop
      - pnpm --filter @ora/desktop test
      - cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  test:web-e2e:
    desc: Run browser-level Web smoke and accessibility tests with failure artifacts
    cmds:
      - pnpm test:web-e2e

  test:desktop-e2e:
    desc: Build and drive the native Windows Tauri shell through embedded WebDriver
    platforms: [windows]
    cmds:
      - pnpm --filter @ora/desktop tauri build --debug --no-bundle --features desktop-e2e
      - pnpm test:desktop-e2e

  coverage:ui:
    desc: Generate UI component coverage and enforce its regression floor
    cmds:
      - pnpm --filter @ora/ui test:coverage

  coverage:rust:
    desc: Generate the Rust line-coverage baseline and enforce its regression floor
    cmds:
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path 'coverage/rust' | Out-Null"
      - cargo llvm-cov --workspace --lcov --output-path coverage/rust/lcov.info --fail-under-lines 65

  audit:
    desc: Run Rust and JavaScript dependency security gates
    cmds:
      - cargo audit
      - pnpm audit --audit-level high

  collect-test-evidence:
    desc: Index available test and coverage artifacts for automated failure triage
    cmds:
      - node scripts/collect-test-evidence.mjs

  test:pr:
    desc: Run deterministic pull-request quality gates without real runtime assets
    cmds:
      - task: check-generated
      - task: test:frontend
      - task: test:backend
      - task: test:desktop

  test:system:
    desc: Run real Bun, Windows Job, plugin, and backend runtime E2E tests
    cmds:
      - task: test-plugin-runtime-e2e

  test:
    desc: Run pull-request gates and real local system tests
    silent: true
    cmds:
      - task: test:pr
      - task: test:system

  ###################################################
  ############# Run Development Servers #############
  ###################################################

  run:frontend:
    desc: Run the web frontend against the real HTTP backend
    cmds:
      - pnpm --filter @ora/web-client dev

  run:ui-showcase:
    desc: Run the UI component showcase in development mode
    cmds:
      - pnpm --filter @ora/ui-showcase dev

  run:desktop:
    desc: Run the desktop Tauri app in development mode
    env:
      ORA_DATA_DIR: "{{.ROOT_DIR}}/.data"
    cmds:
      - pnpm --filter @ora/desktop tauri dev

  run:backend:
    desc: Run the web server backend in development mode
    env:
      ORA_DATA_DIR: .data
      ORA_LOG_LEVEL: '{{.LOG_LEVEL | default "debug"}}'
      ORA_LOG_MODE: '{{.LOG_MODE | default "file"}}'
    cmds:
      - cargo run --bin ora_web_server

  logdy:
    desc: Follow Ora backend's daily logs in the local Logdy UI
    preconditions:
      - sh: command -v logdy >/dev/null 2>&1
        msg: "Logdy is not available on PATH. Provide Logdy before running this task."
      - sh: '{{if eq OS "windows"}}command -v pwsh >/dev/null 2>&1{{else}}true{{end}}'
        msg: "PowerShell 7 is required to follow log files reliably on Windows. Install pwsh and ensure it is available on PATH."
      - sh: ls .data/logs/ora.log.* >/dev/null 2>&1
        msg: "No Ora daily log files found in .data/logs (expected ora.log.YYYY-MM-DD). Start the file-backed backend first."
    cmds:
      - |
        {{if eq OS "windows"}}
        # Logdy 0.17.1 can miss NTFS append notifications, so let PowerShell own the file watch.
        pwsh -NoProfile -Command '
          $logs = @(Get-ChildItem -Path ".data/logs/ora.log.*" -File | Sort-Object Name)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          Get-Content -LiteralPath $logs[-1].FullName -Encoding UTF8 -Wait | ForEach-Object {
            [Console]::Out.WriteLine($_)
            [Console]::Out.Flush()
          }
        ' | logdy --ui-ip 127.0.0.1 --port {{.PORT | default "8090"}} --no-analytics --no-updates --config logdy.config.json
        {{else}}
        set -- .data/logs/ora.log.*
        logdy follow --full-read "$@" --ui-ip 127.0.0.1 --port {{.PORT | default "8090"}} --no-analytics --no-updates --config logdy.config.json
        {{end}}
