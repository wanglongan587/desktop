version: "3"

tasks:
  default:
    cmds:
      - task: list

  list:
    desc: List all tasks in the current project
    cmds:
      - task --list

  ###################################################
  ############## Install Dependencies ###############
  ###################################################

  install:
    desc: Install all dependencies for the project
    cmds:
      - task: install:frontend
      - task: install:backend
      - task: install:desktop
      - task: build

  install:frontend:
    desc: Install dependencies for the frontend packages
    cmds:
      - pnpm install

  install:backend:
    desc: Install dependencies for the Rust backend
    cmds:
      - cargo fetch

  install:desktop:
    desc: Install dependencies for the desktop Tauri app (excluded from workspace)
    dir: apps/desktop/src-tauri
    cmds:
      - cargo fetch

  ###################################################
  ############## Clean and Build Tasks ##############
  ###################################################

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf node_modules
      - |
        {{if eq OS "windows"}}
        pnpm -r exec -- powershell -NoProfile -Command "if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }"
        {{else}}
        pnpm -r exec -- rm -rf node_modules
        {{end}}
      - pnpm store prune
      - cargo clean

  lint:
    desc: Run linters for the frontend, backend, and Desktop app
    cmds:
      - task: lint:frontend
      - task: lint:backend
      - task: lint:desktop

  lint:backend:
    desc: Run linters on all Rust crates
    silent: true
    cmds:
      - cargo fmt --all
      - cargo clippy --workspace -- -D warnings

  lint:frontend:
    desc: Run linters on all frontend packages
    silent: true
    cmds:
      - pnpm --filter @ora/contracts lint
      - pnpm --filter @ora/web-client lint
      - pnpm --filter @ora/chat lint
      - pnpm --filter @ora/platform lint
      - pnpm --filter @ora/app-shell lint

  lint:desktop:
    desc: Run linters for the Desktop TypeScript package and Tauri Rust workspace
    silent: true
    cmds:
      - pnpm --filter @ora/desktop lint
      - cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  export-contracts:
    desc: Regenerate TypeScript contracts and the frontend SDK package
    cmds:
      - cargo xtask export-contracts
      - pnpm --filter @ora/contracts generate:error-schema

  build:
    desc: Build all crates
    cmds:
      - cargo build --workspace

  test:frontend:
    desc: Run TypeScript package test suites (contracts, chat, platform, app-shell)
    cmds:
      - task: export-contracts
      - task: lint:frontend
      - pnpm --filter @ora/contracts test
      - pnpm --filter @ora/chat test
      - pnpm --filter @ora/platform test
      - pnpm --filter @ora/app-shell test

  test:backend:
    desc: Run Rust crate test suites
    cmds:
      - task: lint:backend
      - cargo test --workspace

  test:desktop:
    desc: Run the Desktop transport and independent Tauri Rust workspace tests
    cmds:
      - task: lint:desktop
      - pnpm --filter @ora/desktop test
      - cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  test:
    desc: Run all frontend, backend, and Desktop checks (may take a long time)
    silent: true
    cmds:
      - task: test:frontend
      - task: test:backend
      - task: test:desktop

  ###################################################
  ############# Run Development Servers #############
  ###################################################

  run:prepare:
    desc: Ensure the local .data workspace and rustun repository exist
    cmds:
      - mkdir -p .data
      - |
        if [ ! -d .data/rustun ]; then
          git clone https://github.com/ora-space/rustun.git .data/rustun
        fi

  run:web-frontend:
    desc: Run the web frontend against the real HTTP backend
    cmds:
      - pnpm --filter @ora/web-client dev

  run:ui-showcase:
    desc: Run the UI component showcase in development mode
    cmds:
      - pnpm --filter @ora/ui-showcase dev

  run:desktop:
    desc: Run the desktop Tauri app in development mode
    cmds:
      - pnpm --filter @ora/desktop tauri dev

  run:web-backend:
    desc: Run the web server backend in development mode
    env:
      ORA_DATA_DIR: .data
      ORA_PROJECT_NAME: rustun
      ORA_PROJECT_PATH: .data/rustun
      ORA_LOG_LEVEL: '{{.LOG_LEVEL | default "debug"}}'
      ORA_LOG_MODE: '{{.LOG_MODE | default "file"}}'
    cmds:
      - task: run:prepare
      - cargo run --bin ora_web_server

  run:logdy:
    desc: Follow Ora desktop daily logs in the local Logdy UI
    vars:
      # Tauri derives app_data_dir from the `space.ora.desktop` identifier, which
      # resolves to a different system path per OS, so compute the log directory
      # from the platform convention instead of hardcoding a single path.
      DESKTOP_LOG_DIR:
        sh: |
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) echo "$APPDATA/space.ora.desktop/logs" ;;
            Darwin) echo "$HOME/Library/Application Support/space.ora.desktop/logs" ;;
            *) echo "${XDG_DATA_HOME:-$HOME/.local/share}/space.ora.desktop/logs" ;;
          esac
      # logdy `follow` watches the file through the fsnotify event source, which
      # on Windows never fires for appends coming from a long-lived writer, so the
      # UI freezes right after the initial full read. Feed the active file through
      # `tail -f` + `logdy stdin` instead: tail polls reliably and streams live
      # lines into the same Logdy UI and config.
      ACTIVE_LOG_FILE:
        sh: ls "{{.DESKTOP_LOG_DIR}}"/ora.log.* 2>/dev/null | sort | tail -1
    preconditions:
      - sh: command -v logdy >/dev/null 2>&1
        msg: "Logdy is not available on PATH. Provide Logdy before running this task."
      - sh: command -v tail >/dev/null 2>&1
        msg: "tail is not available on PATH. Provide tail before running this task."
      - sh: test -n "{{.ACTIVE_LOG_FILE}}"
        msg: "No Ora desktop daily log files found in {{.DESKTOP_LOG_DIR}} (expected ora.log.YYYY-MM-DD). Start the desktop app first."
    cmds:
      - |
        logdy stdin --ui-ip 127.0.0.1 --port 8080 --no-analytics --no-updates --config logdy.config.json "tail -f -n +1 '{{.ACTIVE_LOG_FILE}}'"

  run:logdy:web:
    desc: Follow Ora web server daily logs (.data/logs) in the local Logdy UI
    vars:
      # See run:logdy: logdy `follow` misses live appends on Windows, so feed the
      # active file through `tail -f` + `logdy stdin` instead.
      ACTIVE_LOG_FILE:
        sh: ls .data/logs/ora.log.* 2>/dev/null | sort | tail -1
    preconditions:
      - sh: command -v logdy >/dev/null 2>&1
        msg: "Logdy is not available on PATH. Provide Logdy before running this task."
      - sh: command -v tail >/dev/null 2>&1
        msg: "tail is not available on PATH. Provide tail before running this task."
      - sh: test -n "{{.ACTIVE_LOG_FILE}}"
        msg: "No Ora daily log files found in .data/logs (expected ora.log.YYYY-MM-DD). Start the file-backed backend first."
    cmds:
      - |
        logdy stdin --ui-ip 127.0.0.1 --port 8080 --no-analytics --no-updates --config logdy.config.json "tail -f -n +1 '{{.ACTIVE_LOG_FILE}}'"

