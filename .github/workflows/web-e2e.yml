name: Web end-to-end tests

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium functional and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.12.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Web end-to-end tests
        run: task test:web-e2e

      - name: Index Web test evidence
        if: ${{ always() }}
        run: node scripts/collect-test-evidence.mjs --output test-results/web-e2e/evidence-manifest.json

      - name: Upload Web failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: web-e2e-evidence
          path: |
            test-results/web-e2e/
            playwright-report/web/
          if-no-files-found: warn
          retention-days: 14
