name: Desktop end-to-end tests

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Tauri shell
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.12.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run native desktop tests
        run: task test:desktop-e2e

      - name: Index desktop test evidence
        if: ${{ always() }}
        run: node scripts/collect-test-evidence.mjs --output test-results/desktop-e2e/evidence-manifest.json

      - name: Upload desktop failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: desktop-e2e-evidence
          path: test-results/desktop-e2e/
          if-no-files-found: warn
          retention-days: 14
