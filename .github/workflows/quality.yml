name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    name: Pull-request gates (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Rust test runner
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
          fallback: none

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.12.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pull-request quality gates
        run: task test:pr

      - name: Upload Rust test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: rust-test-evidence
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload component test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: component-test-evidence
          path: test-results/components/junit.xml
          if-no-files-found: warn
          retention-days: 14
