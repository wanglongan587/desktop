name: Coverage gates

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust line coverage (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install coverage tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
          fallback: none

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Generate and enforce Rust coverage
        run: task coverage:rust

      - name: Index Rust coverage evidence
        if: ${{ always() }}
        run: node scripts/collect-test-evidence.mjs --output coverage/rust/evidence-manifest.json

      - name: Upload Rust coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: rust-coverage
          path: |
            coverage/rust/lcov.info
            coverage/rust/evidence-manifest.json
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: UI component coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.12.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and enforce UI coverage
        run: task coverage:ui

      - name: Index UI coverage evidence
        if: ${{ always() }}
        run: node scripts/collect-test-evidence.mjs --output coverage/ui/evidence-manifest.json

      - name: Upload UI coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ui-coverage
          path: |
            coverage/ui/lcov.info
            coverage/ui/coverage-summary.json
            coverage/ui/evidence-manifest.json
          if-no-files-found: warn
          retention-days: 14
